# config/families.yaml
# ordinal is implicit: list order == generational order.
# release_date is optional; when omitted the backend uses output.json `created`, then first_seen.
meta:
  blend_ratio: {input: 3, output: 1}   # blended $/1M = (3*prompt + 1*completion) / 4

# A fork is a generation that fans out into multiple tiers: `from` is the model
# that was current when the split happened, `to` lists every tier that came out
# of it. Pairs that are already consecutive members of one family (e.g.
# 5.5 -> Sol) draw as normal successions; the rest draw as labeled branches.
forks:
  - from: openai/gpt-5.5
    to: [openai/gpt-5.6-sol, openai/gpt-5.6-terra, openai/gpt-5.6-luna]
  - from: anthropic/claude-opus-4.8
    to: [anthropic/claude-opus-5, anthropic/claude-fable-5]

families:
  - key: anthropic-opus
    label: "Claude Opus"
    vendor: Anthropic
    group: frontier-us
    members: [anthropic/claude-opus-4, anthropic/claude-opus-4.1, anthropic/claude-opus-4.5,
              anthropic/claude-opus-4.6, anthropic/claude-opus-4.7, anthropic/claude-opus-4.8,
              anthropic/claude-opus-5]
    variants: [anthropic/claude-opus-4.7-fast, anthropic/claude-opus-4.8-fast, anthropic/claude-opus-5-fast]

  - key: anthropic-sonnet
    label: "Claude Sonnet"
    vendor: Anthropic
    group: frontier-us
    members: [anthropic/claude-sonnet-4, anthropic/claude-sonnet-4.5,
              anthropic/claude-sonnet-4.6, anthropic/claude-sonnet-5]

  - key: anthropic-haiku
    label: "Claude Haiku"
    vendor: Anthropic
    group: frontier-us
    members: [anthropic/claude-3-haiku, anthropic/claude-haiku-4.5]

  # A new tier above Opus, launched 2026-06-10 at 2x Opus pricing while
  # Opus 4.8 was still Anthropic's top model.
  - key: anthropic-fable
    label: "Claude Fable"
    vendor: Anthropic
    group: frontier-us
    members: [anthropic/claude-fable-5]

  # At 5.6 OpenAI split the lineup into three named tiers, all launched
  # 2026-07-10: Sol ($5/$30 — the flagship, at exactly GPT-5.5's price),
  # Terra ($2.50/$15, a new middle tier) and Luna ($1/$6, the small tier).
  # Sol therefore continues this line; Luna continues the mini line; Terra
  # starts a line of its own. The split itself is declared under `forks:`.
  - key: openai-flagship
    label: "OpenAI flagship"
    vendor: OpenAI
    group: frontier-us
    members: [openai/gpt-4o, openai/gpt-4.1, openai/gpt-5, openai/gpt-5.1, openai/gpt-5.2,
              openai/gpt-5.4, openai/gpt-5.5, openai/gpt-5.6-sol]

